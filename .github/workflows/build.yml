name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Lockify-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Lockify.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest Lockify.apk \
            --title "Lockify (latest build)" \
            --notes "Latest debug APK, built automatically from commit ${{ github.sha }}." \
            --target ${{ github.sha }}
